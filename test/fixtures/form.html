<!doctype html>
<html>
  <body>
    <form>
      <label for="fn">First Name</label>
      <input id="fn" name="first_name" type="text" />

      <label for="em">Email address</label>
      <input id="em" name="email" type="email" />

      <div>
        <span id="lbl-auth">Are you legally authorized to work in the United States?</span>
        <select id="auth" aria-labelledby="lbl-auth">
          <option value="">Select an option</option>
          <option value="y">Yes</option>
          <option value="n">No</option>
        </select>
      </div>

      <fieldset>
        <legend>Will you now or in the future require sponsorship?</legend>
        <label><input type="radio" name="sponsor" value="yes" /> Yes</label>
        <label><input type="radio" name="sponsor" value="no" /> No</label>
      </fieldset>

      <label for="why">Why do you want to work here?</label>
      <textarea id="why" name="why" maxlength="300"></textarea>

      <label for="yrs">How many years of experience do you have with Python?</label>
      <input id="yrs" name="python_years" type="number" />

      <label><input type="checkbox" id="tos" name="tos" /> I certify the information is accurate</label>

      <div class="ashby-application-form-field-entry" data-field-path="sponsorship-buttons">
        <label class="ashby-application-form-question-title required" for="sponsorship-buttons-input">Will you require sponsorship?</label>
        <div class="ashby-application-form-input-yesno">
          <button type="button" data-option="yes" aria-pressed="false">Yes</button>
          <button type="button" data-option="no" aria-pressed="false">No</button>
          <input id="sponsorship-buttons-input" name="sponsorship-buttons" type="checkbox" tabindex="-1" style="width:0;height:0;opacity:0" />
        </div>
      </div>

      <label for="resume-upload">Upload your resume</label>
      <input type="file" id="resume-upload" name="resume" accept=".pdf,.doc,.docx" />

      <label for="cover-letter-upload">Optional cover letter</label>
      <input type="file" id="cover-letter-upload" name="cover_letter" accept=".pdf,.doc,.docx" />

      <label id="source-label" for="source-combo">How did you hear about us?</label>
      <div class="select__value-container">
        <div class="select__placeholder">Select...</div>
        <input id="source-combo" role="combobox" aria-labelledby="source-label" aria-expanded="false" type="text" />
      </div>

      <label id="major-label" for="major-combo">Are you pursuing a Computer Science major?</label>
      <div class="select__value-container select__value-container--has-value">
        <div class="select__single-value">Yes</div>
        <input id="major-combo" role="combobox" aria-labelledby="major-label" aria-expanded="false" type="text" style="opacity:0" />
      </div>

      <input type="hidden" name="csrf" value="x" />
      <input type="search" name="search" placeholder="Search jobs" />
      <button type="submit">Submit</button>
    </form>
    <script>
      document.querySelectorAll('.ashby-application-form-input-yesno button').forEach((button) => {
        button.addEventListener('click', () => {
          button.parentElement.querySelectorAll('button').forEach((candidate) => candidate.setAttribute('aria-pressed', String(candidate === button)));
        });
      });
      const source = document.getElementById('source-combo');
      source.addEventListener('input', () => {
        let list = document.getElementById('source-options');
        if (list) list.remove();
        list = document.createElement('div');
        list.id = 'source-options';
        list.setAttribute('role', 'listbox');
        ['Handshake', 'LinkedIn', 'Employee referral'].forEach((label) => {
          const option = document.createElement('div');
          option.setAttribute('role', 'option');
          option.textContent = label;
          option.addEventListener('click', () => {
            const container = source.closest('.select__value-container');
            container.querySelector('.select__placeholder')?.remove();
            let selected = container.querySelector('.select__single-value');
            if (!selected) {
              selected = document.createElement('div');
              selected.className = 'select__single-value';
              container.prepend(selected);
            }
            selected.textContent = label;
            source.value = '';
            list.remove();
          });
          list.appendChild(option);
        });
        document.body.appendChild(list);
        source.setAttribute('aria-controls', list.id);
        source.setAttribute('aria-expanded', 'true');
      });
    </script>
  </body>
</html>
